name: Dev Container Features - Release & Docs

on:
  workflow_dispatch: {}

  # Triggered every time when make changes to devcontainer-features/src/*/devcontainer-feature.json file
  # It will skip the feature if it is already published for the same version, so it is safe
  push:
    branches: [main]
    paths:
      - devcontainer-features/src/*/devcontainer-feature.json

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    if: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Publish Dev Container Features
        uses: devcontainers/action@bef2cf2d1a019b00b45e184f83035e01bd1972f3 # v1.4.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          publish-features: true
          base-path-to-features: ./devcontainer-features/src
          generate-docs: true

      - name: Generate GitHub App token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: generate-token
        with:
          client-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: Create PR for generated docs
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.generate-token.outputs.token }}
          sign-commits: true
          title: Automated documentation update
          body: |
            Automated documentation update for Dev Container Features.
          branch: automated-documentation-update/${{ github.run_id }}
          delete-branch: true
